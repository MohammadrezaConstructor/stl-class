<!-- STL Facet Anatomy — compact / iframe-friendly build -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STL Facet Anatomy</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root{
    --bg:#eef1f5;
    --panel:#ffffff;
    --grid:#e3e8ee;
    --line:#2f6f93;        /* blueprint */
    --line-soft:#d6dde4;
    --ink:#1f2933;
    --ink-dim:#647281;
    --kw:#1f6fb2;          /* STL keywords */
    --num:#2c7a55;         /* coordinates */
    --accent:#e07b1a;      /* redline / active facet */
    --accent-dim:#b9701f;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;

    /* pane height — tweak these two if you want a taller/shorter embed */
    --pane-h:clamp(260px, 56vh, 520px);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #f7f9fb 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:var(--sans);
    overflow-x:hidden;              /* no stray horizontal scrollbar in the frame */
    -webkit-text-size-adjust:100%;
  }
  /* fluid: fills whatever width the iframe gives it, up to 900px */
  .wrap{width:100%;max-width:900px;margin:0 auto;padding:14px 12px 18px}

  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
    border-bottom:1px solid var(--line-soft);
    padding-bottom:10px;margin-bottom:12px;
  }
  .title{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
  .eyebrow{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--line);
  }
  h1{margin:0;font-size:clamp(14px,3.4vw,18px);font-weight:600;letter-spacing:-.01em}
  h1 b{color:var(--accent);font-weight:600}
  .sub{color:var(--ink-dim);font-size:11px;max-width:46ch;line-height:1.45}

  .shapes{display:flex;gap:5px;flex-wrap:wrap}
  .shapes button{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
    color:var(--ink-dim);background:var(--panel);
    border:1px solid var(--line-soft);border-radius:7px;
    padding:6px 9px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .shapes button:hover{color:var(--ink);border-color:var(--line)}
  .shapes button[aria-pressed="true"]{
    color:var(--accent);border-color:var(--accent);
    background:rgba(224,123,26,.10);
  }

  /* auto-fit: two columns when there's room, one column as soon as there isn't.
     Reacts to the CONTAINER, not just the viewport — safer inside an iframe. */
  .grid{
    display:grid;gap:10px;align-items:stretch;
    grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));
  }

  .pane{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:10px;overflow:hidden;
