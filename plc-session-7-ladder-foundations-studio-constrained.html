<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLC 7 · Reading a ladder diagram</title>
<style>
:root{color-scheme:light;--ink:#20342f;--muted:#50625b;--active:#086453;--soft:#e4f2e9;--line:#ced8ce;--paper:#f8f7f2;--white:#fffefa;--mono:ui-monospace,Consolas,monospace;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1000px;margin:auto;padding:0 clamp(14px,4vw,48px) 30px}
header,.sheet-head,.controls-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
header{padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
a{color:var(--active);text-underline-offset:4px}
header a{font-size:.92rem}
label[for="lessonSelect"],.eyebrow,.rung-number{font:700 .75rem var(--mono);letter-spacing:.05em;text-transform:uppercase}
.picker{display:flex;align-items:center;gap:8px}
select,button,input{font:inherit}
select,button{border:1px solid #acb9ae;background:var(--white);color:var(--ink);border-radius:5px;cursor:pointer}
select{padding:5px;max-width:100%}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a16010;outline-offset:3px}
.eyebrow{color:var(--active);margin:24px 0 6px}
h1{font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.045em;line-height:1.12;margin:0}
h2{font-size:1.08rem;letter-spacing:-.015em;margin:0}
p{margin:0}
#problem{max-width:80ch;margin:8px 0 18px}
.sheet{border:1px solid var(--line);border-radius:10px;background:var(--white);overflow:hidden}
.sheet-head{padding:11px 15px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.rung-number{color:var(--muted);font-size:.73rem;margin-right:.6em}
.rung-picker{font-size:.87rem}
.diagram{padding:3px 10px}
svg{display:block;width:100%;max-width:730px;margin:auto}
svg text{text-anchor:middle;fill:var(--ink);font:650 15px var(--mono)}
svg .reading{font-size:13px;font-weight:600;fill:var(--muted)}
svg .active-text{fill:var(--active)}
svg .rail,svg .wire,svg .symbol{fill:none;stroke:#58685e;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
svg .wire{stroke:#87958c;stroke-dasharray:4 4}
svg .lit{stroke:var(--active);stroke-dasharray:none;stroke-width:3}
svg .rail{stroke-width:4}
svg .timer-block{fill:#f1f5ef;stroke:#53675d;stroke-width:2}
svg .timer-enabled{fill:var(--soft);stroke:var(--active)}
.result{padding:12px 15px;background:#ecf2eb;border-top:1px solid var(--line);min-height:3em;font-size:.97rem}
.controls{padding:13px 15px 16px;border-top:1px solid var(--line)}
.reset{padding:4px 5px;border:0;background:transparent;color:var(--active);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.input-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px}
.input-row label,.time-step{cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:38px;border:1px solid var(--line);padding:5px 10px;border-radius:6px;font-size:.91rem}
.input-row label:has(:checked){background:var(--soft);border-color:#9dbca9}
.input-row input{accent-color:var(--active);margin:0}
.bit{font:700 .73rem var(--mono)}
.time-step:disabled{color:var(--muted);cursor:default;background:#f1f1eb}
#try{font-size:.92rem;color:var(--muted);margin:10px 0 0}
.reading-note{margin-top:15px;font-size:.93rem;max-width:82ch}
.reading-note p{margin-top:4px}
[hidden]{display:none!important}
@media(max-width:520px){.eyebrow{margin-top:18px}.sheet-head,.controls{padding-inline:11px}.diagram{padding:2px}.result{padding:10px 11px}.input-row{gap:6px}header{gap:7px}.picker label{font-size:.7rem}.picker select{font-size:.85rem}}
</style>
</head>
<body>
<main>
<header>
  <a href="index.html">← Learning home</a>
  <div class="picker"><label for="lessonSelect">Example</label><select id="lessonSelect">
    <option value="signal">1 · Box sensor</option><option value="logic">2 · Press controls</option>
    <option value="holding">3 · Holding circuit</option><option value="timer">4 · Warning timer</option>
  </select></div>
</header>
<p class="eyebrow">PLC 7 · Ladder foundations</p>
<h1 id="title">Read a sensor contact and a coil</h1>
<p id="problem"></p>
<section class="sheet" aria-labelledby="rungName">
  <div class="sheet-head">
    <h2><span id="rungNumber" class="rung-number"></span><span id="rungName"></span></h2>
    <select id="rungSelect" class="rung-picker" aria-label="Rung to display" hidden></select>
  </div>
  <div class="diagram"><svg id="ladder" role="img" aria-labelledby="diagramTitle diagramDesc"></svg></div>
  <p id="result" class="result" role="status"></p>
  <div class="controls">
    <div class="controls-head"><h2>Change the inputs</h2><button type="button" id="reset" class="reset">Reset example</button></div>
    <div id="inputs" class="input-row"></div>
    <p id="try"></p>
  </div>
</section>
<section class="reading-note">
  <h2>How to read the rung</h2>
  <p>Start at the left rail. Each contact shows whether its test is <b>TRUE</b> or <b>FALSE</b>. The solid teal line shows how far the path reaches. A dashed segment has no path from the left rail.</p>
  <p id="symbolNote"></p>
</section>
</main>
<script>
(function runLesson(){
  const byId = id => document.getElementById(id);
  const contact = (tag, inverted = false) => ({ tag, inverted });
  const rung = (name, columns, target, reason, preset = 0) => ({ name, columns, target, reason, preset });
  const onOff = value => value ? "ON" : "OFF";
  const truth = value => value ? "TRUE" : "FALSE";

  const lessons = {
    signal: {
      title:"Read a sensor contact and a coil",
      problem:"When a box reaches a photoelectric sensor, the controller must command the conveyor motor to run. Removing the box must turn the command off.",
      inputs:[["SENSOR","Box at sensor",false]],
      prompt:"Switch the sensor ON and follow the path all the way to MOTOR. Then switch it OFF.",
      note:"The two vertical bars are a normally open contact. Its test is TRUE when the stored bit is ON. The parentheses mark a coil. An ordinary coil writes ON when the path reaches it and OFF otherwise.",
      rungs:[rung("Detect a box",[[contact("SENSOR")]],"MOTOR", b => b.SENSOR ? "The sensor is ON. Its normally open contact passes the path to the motor coil." : "The sensor is OFF. Its normally open contact blocks the path to the motor coil.")]
    },
    logic: {
      title:"Read two paths through a press control",
      problem:"A press needs a closed guard and no fault. Either the foot switch or the panel button can request a stroke.",
      inputs:[["GUARD","Guard closed",true],["FOOT","Foot switch",false],["PANEL","Panel button",false],["FAULT","Fault active",false]],
      prompt:"Turn on the panel button, then turn on the fault. Which contact breaks the path to PRESS?",
      note:"Contacts in series must all pass. Parallel branches give a choice of paths. The slash on FAULT marks a normally closed contact. It passes when the FAULT bit is OFF.",
      rungs:[rung("Command the press",[[contact("GUARD")],[contact("FOOT"),contact("PANEL")],[contact("FAULT",true)]],"PRESS", b => {
        if (!b.GUARD) return "The guard contact blocks the path before it reaches either request.";
        if (!b.FOOT && !b.PANEL) return "Both request contacts are FALSE. Neither branch carries the path across the gap.";
        if (b.FAULT) return "A request reaches FAULT, but the fault bit is ON. Its normally closed contact blocks the path.";
        return "The guard is closed, a request passes, and the FAULT bit is OFF. The path reaches the press coil.";
      })]
    },
    holding: {
      title:"Read the contact that holds a motor on",
      problem:"A brief press of Start must keep the conveyor running until Stop is pressed, the guard opens, or the overload trips. A stored run request also lights the run lamp.",
      inputs:[["START_PB","Start held",false],["STOP_OK","Stop released",true],["GUARD_OK","Guard closed",true],["OL_OK","Overload healthy",true]],
      prompt:"Select Start held, then clear it to release Start. Open the guard and close it again. Does the motor restart?",
      note:"The lower RUN_REQUEST contact reads the bit written by the coil. The diagram shows the settled state after each input change. After Start is released, the holding branch can carry the path by itself.",
      rungs:[
        rung("Hold the run request",[[contact("STOP_OK")],[contact("GUARD_OK")],[contact("OL_OK")],[contact("START_PB"),contact("RUN_REQUEST")]],"RUN_REQUEST", b => {
          if (!b.STOP_OK || !b.GUARD_OK || !b.OL_OK) return "A required condition is missing. The series path breaks and the stored run request clears.";
          if (b.START_PB) return "Start completes the upper path. Once the coil writes ON, its own contact also passes on the next scan.";
          if (b.RUN_REQUEST) return "Start is released. The lower contact reads the stored ON bit and keeps the coil on.";
          return "The series contacts pass, but both branches are open. A fresh Start press is needed.";
        }),
        rung("Run the conveyor",[[contact("RUN_REQUEST")]],"M1", b => b.RUN_REQUEST ? "The stored run request is ON, so this contact passes and commands the conveyor motor ON." : "The stored run request is OFF, so the motor command stays OFF."),
        rung("Light the run lamp",[[contact("RUN_REQUEST")]],"RUN_LAMP", b => b.RUN_REQUEST ? "The lamp coil follows the ON run request, even after Start is released." : "The run request is OFF, so the lamp coil is OFF.")
      ]
    },
    timer: {
      title:"Read a three-second warning timer",
      problem:"Enabling the conveyor must first sound a horn for three seconds. When the delay ends, the horn must stop and the conveyor must run.",
      inputs:[["ST","Process enabled",false]],
      prompt:"Switch ST on. Advance the simulated clock one second at a time. Compare the horn and motor rungs before and after 3 s.",
      note:"TON is an on-delay timer. ET is elapsed time and PT is the preset. Q turns ON when ET reaches PT. Switching ST off resets both ET and Q.",
      rungs:[
        rung("Time the warning",[[contact("ST")]],"T_WARN", (b, et) => !b.ST ? "The timer input is OFF, so elapsed time is zero." : et < 3 ? "The timer is enabled. The horn sounds while the timer counts toward 3 s." : "Elapsed time has reached 3 s. The timer's done bit is ON.",3),
        rung("Sound the horn",[[contact("ST")],[contact("T_WARN.Q",true)]],"HORN", b => !b.ST ? "ST is OFF. Even though the normally closed done contact is TRUE, no path reaches it." : b["T_WARN.Q"] ? "The done bit is ON. Its normally closed contact is FALSE, ending the warning." : "ST is ON and the done bit is OFF. Its normally closed contact passes, sounding the horn."),
        rung("Start the conveyor",[[contact("ST")],[contact("T_WARN.Q")]],"M1", b => !b.ST ? "ST is OFF and the conveyor command is OFF." : b["T_WARN.Q"] ? "The done bit is ON. Both contacts pass and the conveyor starts." : "The timer is still counting. Its normally open done contact blocks the motor command.")
      ]
    }
  };

  let current, bits, elapsed, selectedRung;
  const test = item => item.inverted ? !bits[item.tag] : Boolean(bits[item.tag]);

  function solve(seconds = 0) {
    for (const row of current.rungs) {
      const path = row.columns.every(column => column.some(test));
      if (row.preset) {
        elapsed = path ? Math.min(row.preset, elapsed + seconds) : 0;
        bits["T_WARN.Q"] = elapsed >= row.preset;
      } else {
        bits[row.target] = path;
      }
    }
    draw();
  }

  function draw() {
    const row = current.rungs[selectedRung];
    const svg = byId("ladder");
    const width = Math.max(258, Math.round(svg.getBoundingClientRect().width));
    const left = 14, right = width - 14;
    const cell = (right - left) / (row.columns.length + 1);
    const y = 72, lower = 165;
    const branch = row.columns.some(column => column.length > 1);
    const height = branch ? lower + 37 : y + 42;
    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    const fragments = [];
    const path = (d, classes) => fragments.push(`<path class="${classes}" d="${d}"/>`);
    const wire = (x1,y1,x2,y2,live) => path(`M${x1} ${y1} L${x2} ${y2}`,`wire${live ? " lit" : ""}`);
    const label = (x,baseline,tag) => {
      const parts = cell < 105 && tag.includes("_") ? tag.split(/_(?=[^_]*$)/) : [tag];
      const size = cell < 76 ? 12 : 15;
      parts.forEach((part,i) => fragments.push(`<text x="${x}" y="${baseline - (parts.length - i - 1) * 19}" style="font-size:${size}px">${part}${i < parts.length-1 ? "_" : ""}</text>`));
    };
    const reading = (x,baseline,txt,live) => fragments.push(`<text x="${x}" y="${baseline}" class="reading${live ? " active-text" : ""}">${txt}</text>`);
    const drawContact = (item,x,cy,incoming,xLeft,xRight) => {
      const passed = test(item);
      const through = incoming && passed;
      const gap = 6;
      wire(xLeft,cy,x-gap,cy,incoming);
      path(`M${x-gap} ${cy-12}v24 M${x+gap} ${cy-12}v24`+(item.inverted ? ` M${x-10} ${cy+13}l20 -26` : ""),`symbol${through ? " lit" : ""}`);
      wire(x+gap,cy,xRight,cy,through);
      label(x,cy-21,item.tag);
      reading(x,cy+28,truth(passed),passed);
      return through;
    };
    path(`M${left} 14 V${height-10}`, "rail lit");
    path(`M${right} 14 V${height-10}`, "rail");
    let powered = true;
    row.columns.forEach((column,i) => {
      const start = left + i*cell, end = start + cell, x = (start+end)/2;
      if (column.length === 1) {
        powered = drawContact(column[0],x,y,powered,start,end);
        return;
      }
      const entry = start+2, exit=end-2;
      wire(start,y,entry,y,powered);
      wire(entry,y,entry,lower,powered);
      const upperOn = drawContact(column[0],x,y,powered,entry,exit);
      const lowerOn = drawContact(column[1],x,lower,powered,entry,exit);
      wire(exit,lower,exit,y,lowerOn);
      powered = upperOn || lowerOn;
      wire(exit,y,end,y,powered);
    });
    const lastStart = right-cell, x = lastStart + cell/2;
    if (row.preset) {
      const half = Math.min(58,cell*.36);
      wire(lastStart,y,x-half,y,powered);
      wire(x+half,y,right,y,bits["T_WARN.Q"]);
      fragments.push(`<rect x="${x-half}" y="${y-23}" width="${2*half}" height="46" rx="2" class="timer-block${powered ? " timer-enabled" : ""}"/>`);
      label(x,y-31,row.target);
      fragments.push(`<text x="${x}" y="${y-3}">TON</text>`);
      reading(x,y+13,`PT ${row.preset} s`,powered);
      reading(x,y+38,`Q ${onOff(bits["T_WARN.Q"])}`,bits["T_WARN.Q"]);
    } else {
      wire(lastStart,y,x-12,y,powered);
      path(`M${x-5} ${y-13} Q${x-19} ${y} ${x-5} ${y+13} M${x+5} ${y-13} Q${x+19} ${y} ${x+5} ${y+13}`,`symbol${powered ? " lit" : ""}`);
      wire(x+12,y,right,y,powered);
      label(x,y-21,row.target);
      reading(x,y+28,onOff(bits[row.target]),bits[row.target]);
    }
    const descriptions = row.columns.map(column => column.map(item => `${item.tag}, ${item.inverted ? "normally closed" : "normally open"} contact, ${truth(test(item))}`).join(" or ")).join(" then ");
    const output = row.preset ? `ET ${elapsed} of ${row.preset} s · Q ${onOff(bits["T_WARN.Q"])}` : `${row.target} ${onOff(bits[row.target])}`;
    const explanation = row.reason(bits,elapsed);
    svg.innerHTML = `<title id="diagramTitle">${row.name}</title><desc id="diagramDesc">From left to right: ${descriptions}. ${output}.</desc>`+fragments.join("");
    const multiple = current.rungs.length > 1;
    byId("rungNumber").hidden = multiple;
    byId("rungNumber").textContent = `R${selectedRung + 1}`;
    byId("rungName").textContent = multiple ? "Select a rung" : row.name;
    const feedback = `<strong>${output}.</strong> ${explanation}`;
    if (byId("result").innerHTML !== feedback) byId("result").innerHTML = feedback;
    const advance = byId("advance");
    if (advance) advance.disabled = !bits.ST || bits["T_WARN.Q"];
  }

  function loadLesson(){
    current = lessons[byId("lessonSelect").value];
    bits = {};
    elapsed = 0;
    selectedRung = 0;
    byId("title").textContent = current.title;
    byId("problem").textContent = current.problem;
    byId("symbolNote").textContent = current.note;
    byId("try").innerHTML = `<b>Try it.</b> ${current.prompt}`;
    const selector = byId("rungSelect");
    selector.innerHTML = current.rungs.map((row,i) => `<option value="${i}">R${i+1} · ${row.name}</option>`).join("");
    selector.hidden = current.rungs.length === 1;
    byId("inputs").innerHTML = current.inputs.map(([tag,label,initial]) => {
      bits[tag] = initial;
      return `<label><input type="checkbox" id="${tag}" data-tag="${tag}" ${initial ? "checked" : ""}>${label} <span class="bit">${onOff(initial)}</span></label>`;
    }).join("") + (current === lessons.timer ? '<button type="button" class="time-step" id="advance">Advance 1 s</button>' : "");
    solve();
  }

  byId("inputs").addEventListener("change", e => {
    const {tag} = e.target.dataset;
    if (!tag) return;
    bits[tag] = e.target.checked;
    e.target.parentElement.querySelector(".bit").textContent = onOff(bits[tag]);
    solve();
  });
  byId("inputs").addEventListener("click", e => {
    if (e.target.id === "advance") solve(1);
  });
  byId("rungSelect").addEventListener("change",e => { selectedRung = Number(e.target.value); draw(); });
  byId("reset").addEventListener("click",loadLesson);
  byId("lessonSelect").addEventListener("change",loadLesson);
  loadLesson();
  window.addEventListener("resize",draw);
})();
</script>
</body>
</html>
