<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isometric Sketchpad</title>
  <link rel="icon" href="data:,"/>
  <style>
    :root{
      --bg:#0b0f14; --panel:#121822; --ink:#e6eefc; --muted:#9fb3c8; --accent:#4cc9f0; --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{margin:0; background:linear-gradient(180deg,#0b0f14, #0e141d); color:var(--ink); font:14px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji"}
    header{display:flex; align-items:center; gap:.75rem; padding:.75rem 1rem; border-bottom:1px solid #1b2431; position:sticky; top:0; background:rgba(10,14,20,.9); backdrop-filter: blur(8px); z-index:3}
    .toolbar{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center}
    .group{display:flex; gap:.5rem; background:var(--panel); padding:.4rem; border-radius:12px; box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
    button, .toggle{
      appearance:none; border:1px solid #263143; background:#141b26; color:var(--ink); padding:.45rem .7rem; border-radius:10px; cursor:pointer; transition:.15s ease; display:inline-flex; align-items:center; gap:.4rem; font-weight:600
    }
    button:hover, .toggle:hover{border-color:#334257; background:#172233}
    button.primary{background:linear-gradient(180deg,#1b2737,#121a27); border-color:#2a3950}
    .toggle input{accent-color:var(--accent)}
    select{background:#141b26; border:1px solid #263143; color:var(--ink); padding:.45rem .7rem; border-radius:10px}
    #status{margin-left:auto; color:var(--muted); font-weight:600}
    main{display:grid; grid-template-columns: 280px 1fr; min-height:calc(100vh - 56px); height:calc(100vh - 56px)}
    aside{border-right:1px solid #1b2431; background:rgba(18,24,34,.6); padding:1rem; overflow-y:auto;}
    aside h3{margin:.25rem 0 .75rem; font-size:.95rem; color:#b9c7d8; letter-spacing:.2px}
    .toolbtn{width:100%; justify-content:flex-start}
    .danger{color:#ffd7d7; border-color:#48303a; background:#2a1316}
    canvas{display:block; width:100%; height:100%; background:transparent}
    #stage{position:relative; overflow:hidden; height:100%; min-height:500px}
    #backdrop{position:absolute; inset:0; pointer-events:none; background:radial-gradient(1200px 700px at 70% 20%, rgba(76,201,240,.08), transparent 60%), radial-gradient(800px 500px at 20% 80%, rgba(255,107,107,.08), transparent 55%)}
    .hint{color:#8aa2ba; font-size:.85rem; margin-top:.75rem}
    .kbd{font:600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; background:#111723; border:1px solid #27344a; padding:.12rem .35rem; border-radius:6px}
  </style>
</head>
<body>
<header>
  <div class="toolbar">
    <div class="group">
      <label style="display:flex; align-items:center; gap:.5rem; font-weight:700">Mode
        <select id="mode">
          <option value="line">Line</option>
          <option value="circle">Circle</option>
          <option value="ellipse">Oval (Ellipse)</option>
          <option value="arc3">Arc (3-pt)</option>
          <option value="circleArc4">Circle Arc (4-pt)</option>
          <option value="ovalArc4">Oval Arc (4-pt)</option>
          <option value="cube">Cube (Isometric)</option>
          <option value="eraser">Eraser</option>
        </select>
      </label>
      <label class="toggle" title="Dashed style for new objects & preview">
        <input type="checkbox" id="dashed"> Dashed
      </label>
      <label class="toggle" title="Snap to isometric grid">
        <input type="checkbox" id="snap" checked> Snap
      </label>
    </div>
    <div class="group">
      <button id="zoomIn" title="Zoom In (×1.25)">＋</button>
      <button id="zoomOut" title="Zoom Out (÷1.25)">－</button>
      <button id="cancel" title="Cancel current shape">Cancel</button>
      <button id="clear" class="danger" title="Clear all">Clear</button>
      <button id="snapshot" title="Download/Copy PNG">Snapshot</button>
    </div>
  </div>
  <div id="status">Ready</div>
</header>
<main>
  <aside>
    <h3>Tools</h3>
    <div style="display:grid; gap:.4rem">
      <button class="toolbtn" data-mode="line">Line – 2 clicks</button>
      <button class="toolbtn" data-mode="circle">Circle – 2 clicks</button>
      <button class="toolbtn" data-mode="ellipse">Oval – 2 clicks</button>
      <button class="toolbtn" data-mode="arc3">Arc – 3 clicks</button>
      <button class="toolbtn" data-mode="circleArc4">Circle Arc – 4 clicks</button>
      <button class="toolbtn" data-mode="ovalArc4">Oval Arc – 4 clicks</button>
      <button class="toolbtn" data-mode="cube">Cube – 2 clicks</button>
      <button class="toolbtn" data-mode="eraser">Eraser – click near object</button>
    </div>
    <p class="hint">Right-click <span class="kbd">⟶</span> cancel current shape. New drawings honor <b>Dashed</b> & <b>Snap</b>. Zoom rebuilds grid & re-renders shapes.</p>
    <p class="hint">Grid bounds are ±20 world units at 100% zoom. Eraser threshold: 0.5 world units.</p>
  </aside>
  <div id="stage">
    <div id="backdrop"></div>
    <canvas id="canvas"></canvas>
  </div>
</main>
<script>
(function(){
  // --- Math helpers & Iso transform ---------------------------------------
  const TAU = Math.PI*2;
  const COS30 = Math.cos(Math.PI/6);
  const SIN30 = Math.sin(Math.PI/6);
  const b1 = {x: COS30, y: SIN30};
  const b2 = {x: -COS30, y: SIN30};
  const b3 = {x: 0, y: -1};

  function det2(a,b,c,d){return a*d - b*c}
  function clamp(v, a, b){return Math.max(a, Math.min(b, v))}

  function worldToScreen(u,v,w=0){
    const sx = origin.x + scale*(u*b1.x + v*b2.x + w*b3.x);
    const sy = origin.y + scale*(u*b1.y + v*b2.y + w*b3.y);
    return {x:sx, y:sy}
  }
  function screenToWorld(x,y){
    const X = (x - origin.x)/scale, Y = (y - origin.y)/scale;
    const D = det2(b1.x, b2.x, b1.y, b2.y);
    const u = det2(X, b2.x, Y, b2.y)/D;
    const v = det2(b1.x, X, b1.y, Y)/D;
    return {u,v}
  }
  function snapUV({u,v}){ return {u:Math.round(u), v:Math.round(v)} }

  // --- Canvas setup --------------------------------------------------------
  const canvas = document.getElementById('canvas');
  const stageEl = document.getElementById('stage');
  canvas.style.touchAction = 'none';
  const ctx = canvas.getContext('2d');
  const dpr = Math.max(1, window.devicePixelRatio||1);
  let scale = 30;
  let zoom = 1;
  let origin = {x:0, y:0};

  function resize(){
    const rect = document.getElementById('stage').getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    origin = {x: rect.width/2, y: rect.height/2 - 40};
    redrawAll();
  }
  window.addEventListener('resize', resize);
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(()=> resize());
    ro.observe(stageEl || document.getElementById('stage'));
  }

  // --- State ---------------------------------------------------------------
  const modeSel = document.getElementById('mode');
  const dashedChk = document.getElementById('dashed');
  const snapChk = document.getElementById('snap');
  const status = document.getElementById('status');

  const objects = [];
  let currentMode = modeSel.value;
  let tempPts = [];
  const ERASE_THRESHOLD = .5;

  // --- UI wiring -----------------------------------------------------------
  document.querySelectorAll('.toolbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ modeSel.value=b.dataset.mode; setMode(b.dataset.mode) })
  })
  modeSel.addEventListener('change', e=> setMode(e.target.value));
  document.getElementById('zoomIn').addEventListener('click', ()=> setZoom(zoom*1.25));
  document.getElementById('zoomOut').addEventListener('click', ()=> setZoom(zoom/1.25));
  document.getElementById('clear').addEventListener('click', clearAll);
  const cancelBtn = document.getElementById('cancel');
  if (cancelBtn) cancelBtn.addEventListener('click', ()=>{ tempPts.length=0; setStatus('Drawing cancelled.'); redrawAll(); });
  document.getElementById('snapshot').addEventListener('click', snapshotPNG);

  function setMode(m){
    currentMode = m; tempPts.length=0;
    setStatus(`Mode: ${labelFor(m)}. ${modeInstructions(m)}`);
    redrawAll();
  }
  function labelFor(m){
    return ({line:'Line', circle:'Circle', ellipse:'Oval', arc3:'Arc (3-pt)', circleArc4:'Circle Arc (4-pt)', ovalArc4:'Oval Arc (4-pt)', cube:'Cube', eraser:'Eraser'})[m]||m
  }
  function modeInstructions(m){
    return ({
      line:'2 clicks: start, end.',
      circle:'2 clicks: center, radius point.',
      ellipse:'2 clicks: center, radii point.',
      arc3:'3 clicks: center, start-angle, end-angle (first two snap).',
      circleArc4:'4 clicks: center (snap), radius (snap), start (free), end (free).',
      ovalArc4:'4 clicks: center (snap), radii (snap), start (free), end (free).',
      cube:'2 clicks: base corner, size point (snap).',
      eraser:'Click near object to delete.'
    })[m]
  }
  function setStatus(msg){ status.textContent = msg }

  function setZoom(z){ zoom = clamp(z, 0.2, 8); scale = 30*zoom; setStatus(`Zoom: ${zoom.toFixed(2)}×`); redrawAll(); }
  function clearAll(){ objects.length=0; tempPts.length=0; setStatus('Canvas cleared.'); redrawAll(); }
  
  async function snapshotPNG(){
    const rect = canvas.getBoundingClientRect();
    const off = document.createElement('canvas');
    off.width = Math.max(1, Math.floor(rect.width*2));
    off.height = Math.max(1, Math.floor(rect.height*2));
    const octx = off.getContext('2d');
    octx.setTransform(2,0,0,2,0,0);
    drawAll(octx, true);

    const tryClipboard = async ()=>{
      if (!('clipboard' in navigator) || !('ClipboardItem' in window)) return false;
      return new Promise((resolve)=>{
        off.toBlob(async (blob)=>{
          try{
            if(!blob) return resolve(false);
            await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
            resolve(true);
          }catch{ resolve(false) }
        });
      });
    };

    const tryDownload = ()=> new Promise((resolve)=>{
      off.toBlob((blob)=>{
        if(!blob){ resolve(false); return }
        try{
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'isometric-sketchpad.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=> URL.revokeObjectURL(url), 1000);
          resolve(true);
        }catch{ resolve(false) }
      });
    });

    let ok = await tryDownload();
    if(!ok) ok = await tryClipboard();
    if(!ok){
      try{
        const data = off.toDataURL('image/png');
        const w = window.open('about:blank');
        if(w){ w.document.write('<img src="'+data+'" alt="snapshot"/>'); ok = true; }
      }catch{}
    }
    setStatus(ok ? 'Snapshot saved/copied.' : 'Snapshot blocked by embed. Try opening the page directly.');
  }

  // --- Drawing primitives --------------------------------------------------
  function drawDot(x,y,r=1.8, color="#5fb4ff"){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill() }

  function drawGrid(context=ctx){
    const N = Math.ceil(10/zoom) + 2;
    for(let u=-N; u<=N; u++){
      for(let v=-N; v<=N; v++){
        const p = worldToScreen(u,v);
        if(p.x<-20 || p.y<-20 || p.x>canvas.width/dpr+20 || p.y>canvas.height/dpr+20) continue;
        drawDot(p.x,p.y, 1.8);
      }
    }
    
    // Draw Cartesian axes
    const o = worldToScreen(0,0);
    const axisLen = Math.min(5, N-1);
    context.save();
    context.lineWidth = 2;
    context.lineCap = 'round';
    
    // X axis (red, along +u direction / right-down)
    const xEnd = worldToScreen(axisLen, 0);
    context.strokeStyle = '#4ecdc4';
    context.beginPath();
    context.moveTo(o.x, o.y);
    context.lineTo(xEnd.x, xEnd.y);
    context.stroke();
    drawArrowhead(context, o, xEnd, '#4ecdc4');
    context.fillStyle = '#4ecdc4';
    context.font = 'bold 13px Inter, sans-serif';
    context.fillText('X', xEnd.x + 8, xEnd.y + 4);
    
    // Y axis (green, along +v direction / left-down)
    const yEnd = worldToScreen(0, axisLen);
    context.strokeStyle = '#ff6b6b';
    context.beginPath();
    context.moveTo(o.x, o.y);
    context.lineTo(yEnd.x, yEnd.y);
    context.stroke();
    drawArrowhead(context, o, yEnd, '#ff6b6b');
    context.fillStyle = '#ff6b6b';
    context.fillText('Y', yEnd.x - 16, yEnd.y + 4);
    
    // Z axis (blue, vertical up)
    const zEnd = worldToScreen(0, 0, axisLen);
    context.strokeStyle = '#7aa2f7';
    context.beginPath();
    context.moveTo(o.x, o.y);
    context.lineTo(zEnd.x, zEnd.y);
    context.stroke();
    drawArrowhead(context, o, zEnd, '#7aa2f7');
    context.fillStyle = '#7aa2f7';
    context.fillText('Z', zEnd.x + 4, zEnd.y - 6);
    
    // Origin marker
    context.fillStyle = '#7fd9ff';
    context.beginPath();
    context.arc(o.x, o.y, 3, 0, TAU);
    context.fill();
    
    context.restore();
  }
  
  function drawArrowhead(context, from, to, color){
    const angle = Math.atan2(to.y - from.y, to.x - from.x);
    const headLen = 8;
    context.save();
    context.fillStyle = color;
    context.beginPath();
    context.moveTo(to.x, to.y);
    context.lineTo(
      to.x - headLen * Math.cos(angle - Math.PI / 6),
      to.y - headLen * Math.sin(angle - Math.PI / 6)
    );
    context.lineTo(
      to.x - headLen * Math.cos(angle + Math.PI / 6),
      to.y - headLen * Math.sin(angle + Math.PI / 6)
    );
    context.closePath();
    context.fill();
    context.restore();
  }

  // --- Object renderers ----------------------------------------------------
  function renderObject(o, context=ctx){
    const dashed = !!o.dashed;
    context.save();
    context.setLineDash(dashed ? [6,6] : []);
    context.lineWidth = 1.8; context.lineCap='round'; context.lineJoin='round';
    context.strokeStyle = '#e9f1ff';

    switch(o.type){
      case 'line':{
        const a = worldToScreen(o.data.a.u,o.data.a.v); const b = worldToScreen(o.data.b.u,o.data.b.v);
        context.beginPath(); context.moveTo(a.x,a.y); context.lineTo(b.x,b.y); context.stroke();
        break; }
      case 'circle':{
        const c = worldToScreen(o.data.c.u,o.data.c.v); const r = o.data.r*scale;
        context.beginPath(); context.arc(c.x,c.y,r,0,TAU); context.stroke();
        break; }
      case 'ellipse':{
        const c = worldToScreen(o.data.c.u,o.data.c.v);
        context.beginPath();
        context.ellipse(c.x,c.y,o.data.rx*scale, o.data.ry*scale, 0, 0, TAU);
        context.stroke();
        break; }
      case 'arc3':{
        const c = worldToScreen(o.data.c.u,o.data.c.v); const r=o.data.r*scale;
        context.beginPath(); context.arc(c.x,c.y,r,o.data.a0,o.data.a1, o.data.ccw||false); context.stroke();
        break; }
      case 'circleArc4':{
        const c = worldToScreen(o.data.c.u,o.data.c.v); const r=o.data.r*scale;
        context.beginPath(); context.arc(c.x,c.y,r,o.data.a0,o.data.a1, o.data.ccw||false); context.stroke();
        break; }
      case 'ovalArc4':{
        const c = worldToScreen(o.data.c.u,o.data.c.v);
        context.beginPath(); context.ellipse(c.x,c.y,o.data.rx*scale,o.data.ry*scale,0,o.data.a0,o.data.a1,o.data.ccw||false); context.stroke();
        break; }
      case 'cube':{
        const {base, size} = o.data; const s=size;
        const A = {u:base.u, v:base.v, w:0};
        const B = {u:base.u+s, v:base.v, w:0};
        const C = {u:base.u, v:base.v+s, w:0};
        const D = {u:base.u+s, v:base.v+s, w:0};
        const E = {u:base.u, v:base.v, w:s};
        const F = {u:base.u+s, v:base.v, w:s};
        const G = {u:base.u, v:base.v+s, w:s};
        const H = {u:base.u+s, v:base.v+s, w:s};
        const edges=[[A,B],[A,C],[B,D],[C,D],[E,F],[E,G],[F,H],[G,H],[A,E],[B,F],[C,G],[D,H]];
        context.beginPath();
        for(const [p,q] of edges){ const P=worldToScreen(p.u,p.v,p.w), Q=worldToScreen(q.u,q.v,q.w); context.moveTo(P.x,P.y); context.lineTo(Q.x,Q.y) }
        context.stroke();
        break; }
    }

    context.restore();
  }

  // --- Redraw everything ---------------------------------------------------
  function drawAll(context=ctx, forExport=false){
    const w = canvas.width/dpr, h = canvas.height/dpr;
    context.clearRect(0,0,w,h);
    if(forExport){
      const grad = context.createLinearGradient(0,0,0,h);
      grad.addColorStop(0,'#0b0f14'); grad.addColorStop(1,'#0e141d');
      context.fillStyle = grad; context.fillRect(0,0,w,h);
    }
    drawGrid(context);
    for(const o of objects) renderObject(o, context);
    drawPreview();
  }
  function redrawAll(){ drawAll(ctx) }

  // --- Preview logic -------------------------------------------------------
  function drawPreview(){
    if(currentMode==='eraser'){ return }
    const dashed = dashedChk.checked;
    ctx.save(); ctx.setLineDash(dashed ? [6,6] : []); ctx.lineWidth=1.6; ctx.strokeStyle = '#9ad1ff'; ctx.fillStyle='#9ad1ff';

    function mark(p){ const s=worldToScreen(p.u,p.v); ctx.beginPath(); ctx.arc(s.x,s.y,3,0,TAU); ctx.fill() }

    const m = lastMouseWorld; if(!m) { ctx.restore(); return }

    switch(currentMode){
      case 'line':{
        if(tempPts.length===1){ const a=tempPts[0], b = snapChk.checked? snapUV(m):m; const A=worldToScreen(a.u,a.v), B=worldToScreen(b.u,b.v); ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); }
        break }
      case 'circle':{
        if(tempPts.length===1){ const c=tempPts[0]; const r = Math.hypot(m.u-c.u, m.v-c.v); const C=worldToScreen(c.u,c.v); ctx.beginPath(); ctx.arc(C.x,C.y,r*scale,0,TAU); ctx.stroke(); mark(c) }
        break }
      case 'ellipse':{
        if(tempPts.length===1){ const c=tempPts[0]; const rx=Math.abs(m.u-c.u), ry=Math.abs(m.v-c.v); const C=worldToScreen(c.u,c.v); ctx.beginPath(); ctx.ellipse(C.x,C.y, rx*scale, ry*scale, 0, 0, TAU); ctx.stroke(); mark(c) }
        break }
      case 'arc3':{
        if(tempPts.length===1){
          const c=tempPts[0]; mark(c); const r = Math.hypot(m.u-c.u, m.v-c.v); const C=worldToScreen(c.u,c.v); ctx.beginPath(); ctx.arc(C.x,C.y,r*scale,0,TAU); ctx.stroke()
        } else if(tempPts.length===2){
          const [c, p1] = tempPts; mark(c);
          const C=worldToScreen(c.u,c.v);
          const r = Math.hypot(p1.u-c.u, p1.v-c.v);
          const a0 = Math.atan2(p1.v-c.v, p1.u-c.u);
          const a1 = Math.atan2(m.v-c.v, m.u-c.u);
          ctx.beginPath(); ctx.arc(C.x,C.y,r*scale,a0,a1,false); ctx.stroke();
        }
        break }
      case 'circleArc4':{
        if(tempPts.length===1){ const c=tempPts[0]; mark(c); const C=worldToScreen(c.u,c.v); const R = Math.hypot(m.u-c.u, m.v-c.v)*scale; ctx.beginPath(); ctx.arc(C.x,C.y,R,0,TAU); ctx.stroke(); }
        else if(tempPts.length===2){ const [c,rp]=tempPts; mark(c); const C=worldToScreen(c.u,c.v); const r=Math.hypot(rp.u-c.u, rp.v-c.v); ctx.beginPath(); ctx.moveTo(C.x,C.y); ctx.lineTo(worldToScreen(m.u,m.v).x, worldToScreen(m.u,m.v).y); ctx.stroke(); ctx.beginPath(); ctx.arc(C.x,C.y,r*scale,0,TAU); ctx.stroke(); drawDot(worldToScreen(m.u,m.v).x, worldToScreen(m.u,m.v).y, 2.2, '#ff6464');
        } else if(tempPts.length===3){ const [c,rp,sp]=tempPts; mark(c); const C=worldToScreen(c.u,c.v); const r=Math.hypot(rp.u-c.u, rp.v-c.v); const a0=Math.atan2(sp.v-c.v, sp.u-c.u); const a1=Math.atan2(m.v-c.v, m.u-c.u); ctx.beginPath(); ctx.arc(C.x,C.y,r*scale,a0,a1,false); ctx.stroke(); }
        break }
      case 'ovalArc4':{
        if(tempPts.length===1){ const c=tempPts[0]; mark(c); const rx=Math.abs(m.u-c.u), ry=Math.abs(m.v-c.v); const C=worldToScreen(c.u,c.v); ctx.beginPath(); ctx.ellipse(C.x,C.y,rx*scale,ry*scale,0,0,TAU); ctx.stroke(); }
        else if(tempPts.length===2){ const [c,p]=tempPts; mark(c); const rx=Math.abs(p.u-c.u), ry=Math.abs(p.v-c.v); const C=worldToScreen(c.u,c.v); ctx.beginPath(); ctx.ellipse(C.x,C.y,rx*scale,ry*scale,0,0,TAU); ctx.stroke(); drawDot(worldToScreen(m.u,m.v).x, worldToScreen(m.u,m.v).y, 2.2, '#ff6464'); }
        else if(tempPts.length===3){ const [c,p,sp]=tempPts; mark(c); const rx=Math.abs(p.u-c.u), ry=Math.abs(p.v-c.v); const C=worldToScreen(c.u,c.v); const a0 = Math.atan2(sp.v-c.v, sp.u-c.u); const a1 = Math.atan2(m.v-c.v, m.u-c.u); ctx.beginPath(); ctx.ellipse(C.x,C.y,rx*scale,ry*scale,0,a0,a1,false); ctx.stroke(); }
        break }
      case 'cube':{
        if(tempPts.length===1){ const base=tempPts[0]; const size=Math.max(0.01, Math.hypot(m.u-base.u, m.v-base.v)); const ghost={type:'cube', dashed:true, data:{base, size}}; renderObject(ghost) }
        break }
    }

    ctx.restore();
  }

  // --- Placement logic -----------------------------------------------------
  function placePoint(world, snapping){ return (snapping ? snapUV(world) : world) }

  function leftClick(world){
    if(currentMode==='eraser'){ doErase(world); return }

    switch(currentMode){
      case 'line':
        if(tempPts.length===0){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Line: choose end point. Right-click to cancel.') }
        else { const a=tempPts[0], b=placePoint(world, snapChk.checked); objects.push({type:'line', dashed:dashedChk.checked, data:{a,b}}); tempPts.length=0; redrawAll(); }
        break;
      case 'circle':
        if(tempPts.length===0){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Circle: choose radius point.')} 
        else { const c=tempPts[0]; const rp = placePoint(world, snapChk.checked); const rFinal = Math.hypot(rp.u-c.u, rp.v-c.v); objects.push({type:'circle', dashed:dashedChk.checked, data:{c, r:rFinal}}); tempPts.length=0; redrawAll(); }
        break;
      case 'ellipse':
        if(tempPts.length===0){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Oval: choose radii point.')} 
        else { const c=tempPts[0]; const p=placePoint(world, snapChk.checked); const rx=Math.abs(p.u-c.u), ry=Math.abs(p.v-c.v); objects.push({type:'ellipse', dashed:dashedChk.checked, data:{c, rx, ry}}); tempPts.length=0; redrawAll(); }
        break;
      case 'arc3':
        if(tempPts.length===0){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Arc: pick start-angle point (snapped).') }
        else if(tempPts.length===1){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Arc: pick end-angle point (snapped).') }
        else {
          const [c, p1] = tempPts; const p2 = placePoint(world, snapChk.checked);
          const r = Math.hypot(p1.u-c.u, p1.v-c.v);
          const a0 = Math.atan2(p1.v-c.v, p1.u-c.u); const a1 = Math.atan2(p2.v-c.v, p2.u-c.u);
          objects.push({type:'arc3', dashed:dashedChk.checked, data:{c, r, a0, a1, ccw:false}});
          tempPts.length=0; redrawAll();
        }
        break;
      case 'circleArc4':
        if(tempPts.length===0){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Circle Arc: pick radius point (snapped).') }
        else if(tempPts.length===1){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Circle Arc: pick start point on circle (free).') }
        else if(tempPts.length===2){ tempPts.push(world); setStatus('Circle Arc: pick end point on circle (free).') }
        else {
          const [c, rp, sp] = tempPts; const ep = world;
          const r = Math.hypot(rp.u-c.u, rp.v-c.v);
          const a0 = Math.atan2(sp.v-c.v, sp.u-c.u); const a1 = Math.atan2(ep.v-c.v, ep.u-c.u);
          objects.push({type:'circleArc4', dashed:dashedChk.checked, data:{c, r, a0, a1, ccw:false}});
          tempPts.length=0; redrawAll();
        }
        break;
      case 'ovalArc4':
        if(tempPts.length===0){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Oval Arc: pick radii point (snapped).') }
        else if(tempPts.length===1){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Oval Arc: pick start point on ellipse (free).') }
        else if(tempPts.length===2){ tempPts.push(world); setStatus('Oval Arc: pick end point on ellipse (free).') }
        else {
          const [c, rp, sp] = tempPts; const ep = world; const rx=Math.abs(rp.u-c.u), ry=Math.abs(rp.v-c.v);
          const a0 = Math.atan2(sp.v-c.v, sp.u-c.u); const a1 = Math.atan2(ep.v-c.v, ep.u-c.u);
          objects.push({type:'ovalArc4', dashed:dashedChk.checked, data:{c, rx, ry, a0, a1, ccw:false}});
          tempPts.length=0; redrawAll();
        }
        break;
      case 'cube':
        if(tempPts.length===0){ tempPts.push(placePoint(world, snapChk.checked)); setStatus('Cube: pick size point (snapped).') }
        else { const base=tempPts[0]; const p=placePoint(world, snapChk.checked); const size = Math.max(0.01, Math.hypot(p.u-base.u, p.v-base.v)); objects.push({type:'cube', dashed:dashedChk.checked, data:{base, size}}); tempPts.length=0; redrawAll(); }
        break;
    }
  }

  function doErase(world){
    let bestIdx=-1, bestD=Infinity;
    for(let i=0;i<objects.length;i++){
      const o=objects[i]; let centerUv;
      switch(o.type){
        case 'line':{
          const mid={u:(o.data.a.u+o.data.b.u)/2, v:(o.data.a.v+o.data.b.v)/2}; centerUv=mid; break; }
        case 'circle': case 'arc3': case 'circleArc4': centerUv=o.data.c; break;
        case 'ellipse': case 'ovalArc4': centerUv=o.data.c; break;
        case 'cube': centerUv=o.data.base; break;
      }
      const d = Math.hypot(world.u-centerUv.u, world.v-centerUv.v);
      if(d<bestD){ bestD=d; bestIdx=i }
    }
    if(bestD <= ERASE_THRESHOLD && bestIdx>=0){ objects.splice(bestIdx,1); setStatus('Erased object.'); redrawAll(); } else { setStatus('Nothing to erase here.') }
  }

  // --- Mouse handling ------------------------------------------------------
  let lastMouseWorld = null;
  canvas.addEventListener('pointermove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left); const y = (e.clientY - rect.top);
    const uv = screenToWorld(x,y);
    lastMouseWorld = uv;
    redrawAll();
  });

  canvas.addEventListener('pointerleave', ()=>{ lastMouseWorld=null; redrawAll() });

  canvas.addEventListener('contextmenu', (e)=>{ e.preventDefault(); tempPts.length=0; setStatus('Drawing cancelled.'); redrawAll(); });

  canvas.addEventListener('pointerdown', (e)=>{
    if(e.button!==0) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left); const y = (e.clientY - rect.top);
    const uv = screenToWorld(x,y);
    leftClick(uv);
  });

  // --- Boot ---------------------------------------------------------------
  setMode(currentMode);
  resize();
})();
</script>
</body>
</html>
